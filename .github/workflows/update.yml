name: Daily diabetes drug research update

on:
  workflow_dispatch:
  schedule:
    # Daily 07:17 Asia/Seoul (22:17 UTC, previous day). Avoid top-of-hour congestion.
    - cron: '17 22 * * *'
  push:
    branches: [main]
    paths:
      - 'config.json'
      - 'pharma_lab.py'
      - 'update_site.py'
      - 'ai_brief.py'
      - '.github/workflows/update.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: diabetes-pharma-update
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official sources and build dashboard
        env:
          PHARMA_CONTACT_EMAIL: ${{ vars.PHARMA_CONTACT_EMAIL }}
        run: python update_site.py --live
      - name: Optional AI triage (only if a secret key is configured)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python ai_brief.py
      - name: Refresh page navigation after optional AI step
        run: python update_site.py
      - name: Save database and generated site to default branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/pharma_lab.sqlite3 site/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh public diabetes drug monitor [skip ci]'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
